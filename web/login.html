<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f7f3">
  <meta name="robots" content="noindex, nofollow">
  <title>访问码 · 声场</title>
  <style>
    :root {
      --bg: #f4f3ee;
      --panel: #ffffff;
      --text: #171716;
      --soft: #54544e;
      --muted: #8b8b82;
      --line: #e6e5de;
      --ink: #161512;
      --danger: #a94f3f;
      --danger-bg: #fbf1ee;
    }
    * { box-sizing: border-box; }
    html { height: 100%; }
    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 28px 18px calc(28px + env(safe-area-inset-bottom));
      overflow-x: hidden;
      color: var(--text);
      background:
        radial-gradient(1100px 520px at 82% -12%, rgba(255, 255, 255, 0.9), transparent 62%),
        radial-gradient(820px 520px at -10% 110%, rgba(214, 210, 198, 0.55), transparent 65%),
        var(--bg);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC",
        "HarmonyOS Sans SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: min(390px, 100%);
      max-width: 100%;
      min-width: 0;
      padding: 34px 30px 27px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.86);
      box-shadow:
        0 30px 80px -40px rgba(30, 28, 22, 0.45),
        0 0 0 1px rgba(23, 23, 22, 0.035);
      backdrop-filter: blur(18px);
    }
    .mark {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      margin-bottom: 26px;
      border-radius: 14px;
      background: linear-gradient(150deg, #24231f, #0e0d0b);
      box-shadow: 0 12px 26px -14px rgba(0, 0, 0, 0.65);
    }
    .mark svg { width: 25px; height: 25px; color: #fff; }
    .eyebrow {
      margin: 0 0 9px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.26em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: 25px;
      font-weight: 650;
      letter-spacing: -0.02em;
      line-height: 1.25;
    }
    .hint {
      margin: 13px 0 24px;
      color: var(--soft);
      font-size: 12.5px;
      line-height: 1.8;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    input[type="text"] {
      width: 100%;
      height: 58px;
      padding: 0 12px;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 13px;
      outline: none;
      background: #f8f8f4;
      font: inherit;
      font-size: 25px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.34em;
      text-align: center;
      transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }
    input[type="text"]::placeholder {
      color: #c8c8bf;
      font-size: 17px;
      font-weight: 400;
      letter-spacing: 0.18em;
    }
    input[type="text"]:focus {
      border-color: #b9b7ac;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(23, 23, 22, 0.055);
    }
    button {
      width: 100%;
      height: 50px;
      margin-top: 13px;
      color: #fff;
      border: 0;
      border-radius: 13px;
      background: var(--ink);
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: transform 0.16s ease, opacity 0.16s ease;
      -webkit-tap-highlight-color: transparent;
    }
    button:hover { opacity: 0.9; }
    button:active { transform: scale(0.985); }
    .error {
      margin: 13px 0 0;
      padding: 9px 12px;
      color: var(--danger);
      border: 1px solid #efd9d2;
      border-radius: 9px;
      background: var(--danger-bg);
      font-size: 11.5px;
      line-height: 1.6;
    }
    .error:empty { display: none; }
    .foot {
      margin: 22px 0 0;
      padding-top: 17px;
      color: var(--muted);
      border-top: 1px solid var(--line);
      font-size: 10px;
      line-height: 1.75;
    }
    @media (max-width: 380px) {
      .card { padding: 28px 22px 23px; }
      h1 { font-size: 22px; }
    }
    @media (max-height: 720px) {
      body { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M3 10v4M7 7v10M11 4v16M15 7v10M19 9v6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
      </svg>
    </div>
    <p class="eyebrow">Soundfield · 声场</p>
    <h1>输入访问码</h1>
    <p class="hint">这是一个只对你开放的私人播放器。访问码显示在电脑上的远程访问窗口和二维码页面里，扫码打开通常会自动登录。</p>
    <form method="post" action="/login" autocomplete="off">
      <input type="hidden" name="next" value="{{NEXT}}">
      <label for="code">访问码</label>
      <input id="code" name="code" type="text" inputmode="numeric" maxlength="16"
             autocomplete="one-time-code" autocapitalize="off" autocorrect="off"
             spellcheck="false" placeholder="• • • • • •" autofocus required>
      <button type="submit">进入播放器</button>
      <p class="error" role="alert">{{ERROR}}</p>
    </form>
    <p class="foot">如果你换了一台手机、换了浏览器，或清除了网站数据，只要重新输入一次访问码即可。电脑上的远程访问窗口需要保持开启。</p>
  </main>
</body>
</html>
